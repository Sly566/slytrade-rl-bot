# Example Secret for broker credentials (never commit real values).
#
#   cp secret.example.yaml secret.yaml   # then fill in values
#   kubectl -n slytrade apply -f secret.yaml
#
# The paper loop does NOT require broker credentials; this is reserved for the
# future guarded live adapter. Reference it from the deployment via envFrom
# when (and only when) the deployment gate has been approved.

apiVersion: v1
kind: Secret
metadata:
  name: slytrade-broker
  namespace: slytrade
type: Opaque
stringData:
  MT5_LOGIN: "0000000"
  MT5_PASSWORD: "change-me"
  MT5_SERVER: "BrokerName-Demo"
