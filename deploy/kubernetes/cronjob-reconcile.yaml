apiVersion: batch/v1
kind: CronJob
metadata:
  name: slytrade-reconcile
  namespace: slytrade
  labels:
    app.kubernetes.io/name: slytrade
    app.kubernetes.io/component: reconciliation
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: slytrade
            app.kubernetes.io/component: reconciliation
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: reconcile
              image: slytrade-rl-bot:latest
              imagePullPolicy: IfNotPresent
              args:
                - "reconcile"
                - "--symbol"
                - "XAUUSD"
              env:
                - name: SLYTRADE_ENV
                  value: "production"
                - name: SLYTRADE_ALLOW_LIVE
                  value: "0"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: configs
                  mountPath: /app/configs
                  readOnly: true
          volumes:
            - name: configs
              configMap:
                name: slytrade-config
