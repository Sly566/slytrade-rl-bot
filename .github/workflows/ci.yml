name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test with coverage
        run: |
          pytest --cov=slytrade --cov-report=term-missing --cov-fail-under=70

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: slytrade-rl-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
