services:
  # Production paper-trading service (default). Runs the supervised loop with
  # Prometheus metrics on :9108. Fail-closed: live trading stays disabled.
  slytrade:
    build:
      context: .
      target: production
      args:
        EXTRAS: data,mt5
    image: slytrade-rl-bot:production
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    command: ["paper"]
    environment:
      SLYTRADE_ENV: production
      SLYTRADE_ALLOW_LIVE: "0"
      SLYTRADE_STAGE: paper
      SLYTRADE_SYMBOL: "${SLYTRADE_SYMBOL:-XAUUSD}"
      SLYTRADE_TIMEFRAME: "${SLYTRADE_TIMEFRAME:-M1}"
      SLYTRADE_METRICS_PORT: "9108"
      SLYTRADE_METRICS_BIND: "0.0.0.0"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./state:/app/state
    ports:
      - "9108:9108"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9108/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Development and CI image. It is opt-in so a production compose up never
  # mounts source or test code into the runtime container.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: development
      args:
        EXTRAS: data,mt5
    image: slytrade-rl-bot:development
    init: true
    command: ["doctor"]
    environment:
      SLYTRADE_ENV: development
      SLYTRADE_ALLOW_LIVE: "0"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    restart: "no"
