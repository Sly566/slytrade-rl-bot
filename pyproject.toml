description = "Production-grade MT5 tick-and-bar based ICT/SMC scalper (OB retests + liq sweeps + BOS continuation) pre-RL"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "prometheus-client>=0.20"
]

[project.optional-dependencies]
data = [
  "pyarrow>=15.0",
  "polars>=0.20"
]

dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0.12.20250516"
]

rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "sb3-contrib>=2.3",
  "torch>=2.2",
  "optuna>=3.6",
  "mlflow>=2.14"
]

explain = [
  "shap>=0.45",
  "transformers>=4.42"
]

mt5 = [
  "mt5linux>=0.1"
]

[project.scripts]
slytrade = "slytrade.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Only enable bug-finding rules — style nits (multi-statement lines, naming
# conventions, PEP 585/604 upgrades, etc.) are intentionally NOT enforced on
# a performance-critical trading codebase where local idioms dominate.
select = ["F", "I", "B"]
ignore = [
    "E501",    # line too long
    "B008",    # function argument default (mutables are intentional in dataclass defaults)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
