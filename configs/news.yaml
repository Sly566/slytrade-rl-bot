# Red-folder (high-impact news) gate — pauses NEW entries during event windows.
#
# The gate is DISABLED by default and stays disabled while `enabled: false` or
# the file is missing. Open positions and risk-reducing exits are never touched.
#
# Three sources, in order of precedence (when `enabled: true`):
#   1. calendar_url / calendar_path — a live/static economic-calendar feed
#      (JSON: {"events": [{"name","start_utc","end_utc","impact"}]} or CSV with
#      those columns). Prefer this for production.
#   2. explicit `events:` windows below.
#   3. `enable_recurring` — approximations of NFP / FOMC / CPI for dry-run only
#      (no US DST adjustment; FOMC dates shift every year).

enabled: false
year: 2026

# Minutes added before/after each event window.
quiet_before_minutes: 15
quiet_after_minutes: 15

# Only pause for events at/above this impact (low | medium | high).
min_impact: high

# Optional economic-calendar feed (URL wins over path). Leave empty to disable.
calendar_url: ""
calendar_path: ""

# Approximate recurring US red-folder events (NFP/FOMC/CPI, UTC). Off by default.
enable_recurring: false

# Explicit event windows (UTC). Add real calendar entries here.
events:
  # - name: "NFP"
  #   start: "2026-09-04T12:30:00"
  #   end: "2026-09-04T13:45:00"
  # - name: "FOMC"
  #   start: "2026-09-16T18:00:00"
  #   end: "2026-09-16T19:30:00"
