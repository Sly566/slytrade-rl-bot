# Red-folder (high-impact news) gate — pauses NEW entries during event windows.
#
# The gate is DISABLED by default and stays disabled while `enabled: false` or
# the file is missing. Open positions and risk-reducing exits are never touched.
#
# For production, load explicit event windows (UTC) from a trusted economic
# calendar. The optional `enable_recurring` rule is an approximation of the US
# Non-Farm Payroll release (first Friday of each month, 12:30 UTC) for dry-run
# convenience only — it does not adjust for US daylight saving time.

enabled: false
year: 2026

# Minutes added before/after each event window.
quiet_before_minutes: 15
quiet_after_minutes: 15

# Approximate recurring US red-folder events (UTC). Off by default.
enable_recurring: false

# Explicit event windows (UTC). Add real calendar entries here.
events:
  # - name: "NFP"
  #   start: "2026-09-04T12:30:00"
  #   end: "2026-09-04T13:45:00"
  # - name: "FOMC"
  #   start: "2026-09-16T18:00:00"
  #   end: "2026-09-16T19:30:00"
