environment:
  initial_balance: 100000
  episode_length_bars: 1000

data:
  symbols: ["XAUUSD"]
  train_start: "2024-01-01"
  train_end: "2025-12-31"
  validation_start: "2026-01-01"
  validation_end: "2026-06-30"

walk_forward:
  enabled: true
  train_window_bars: 200000
  validation_window_bars: 50000
  embargo_bars: 500

rl:
  algorithm: PPO
  total_timesteps: 100000
  seed: 42
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  risk_per_trade: 0.005
  stop_loss_atr: 1.0
  take_profit_atr: 2.0
  reward_scale: 1.0

regime:
  volatility_lookback: 100
  volatile_z_threshold: 0.8
  quiet_z_threshold: -0.8
  trend_threshold_atr: 0.15
